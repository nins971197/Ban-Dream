plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = "${mod_version}"
group = "${maven_group}"
base.archivesName = "ban_dream"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

minecraft {
    mappings channel: 'official', version: "${minecraft_version}"

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                bandream {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                bandream {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets {
    // Compile-only JEI descriptors. These classes are deliberately excluded
    // from the jar so Ban Dream has no hard JEI dependency.
    jeiStub {
        java.srcDirs = ['src/jeiStub/java']
    }
    main {
        compileClasspath += sourceSets.jeiStub.output
    }
}

mixin {
    add sourceSets.main, 'bandream.refmap.json'
    config 'bandream.mixins.json'
}

repositories {
    maven { url = 'https://maven.aliyun.com/repository/central' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://repo.spongepowered.org/maven/' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('compileJava').configure {
    dependsOn tasks.named('compileJeiStubJava')
}

jar {
    exclude 'mezz/**'
    manifest {
        attributes([
            "Specification-Title"     : "Ban Dream",
            "Specification-Vendor"    : "nins77",
            "Specification-Version"   : "1",
            "Implementation-Title"    : "Ban Dream",
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "nins77"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs << '-Xlint:deprecation'
}

tasks.named('jar').configure {
    finalizedBy('reobfJar')
}
