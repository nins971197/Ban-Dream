plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = 'ban_dream-neoforge-1.20.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

legacyForge {
    version = project.minecraft_version + '-' + project.neoforge_version

    runs {
        client {
            client()
            systemProperty 'forge.logging.console.level', 'debug'
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.logging.console.level', 'debug'
        }
    }

    mods {
        bandream {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    manifest {
        attributes(
            'Specification-Title': 'Ban Dream',
            'Specification-Vendor': 'nins77',
            'Implementation-Title': 'Ban Dream',
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'nins77'
        )
    }
}
