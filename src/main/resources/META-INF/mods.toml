modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"

[[mods]]
modId = "bandream"
version = "${file.jarVersion}"
displayName = "Ban Dream"
authors = "nins77"
displayTest = "IGNORE_ALL_VERSION"
description = '''
Ban Dream

Server-side administration for banning items, blocks, entities, structures, enchantments,
dimensions, mob effects and item NBT. Bans support global or per-dimension scope,
an optional paginated item and block browser, written-book exports and editable JSON config.
A Ban Stick provides option panels for blocks, mobs and barrel contents.
Player whitelist entries exempt selected players from player-facing restrictions.
Optional Curios integration also removes banned items from equipped curio slots.

Commands:
/bbban ban ...    create or update a ban
/bbban unban ...  remove bans
/bbban list ...   list bans, or open the item browser
/bbban whitelist ... manage exempt players
/bbban stick      obtain the Ban Stick
/bbban reload     reload config/bandream/bans.json

Requires permission level 3 (administrator).
'''

[[dependencies.bandream]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.bandream]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1]"
ordering = "NONE"
side = "BOTH"

[[dependencies.bandream]]
modId = "jei"
mandatory = false
versionRange = "[15,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.bandream]]
modId = "curios"
mandatory = false
versionRange = "[5.10.0,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "bandream.mixins.json"
